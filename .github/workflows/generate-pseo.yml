name: Generate PSEO Content (weekly)

on:
  # Run weekly on Sunday at 04:00 UTC — reduced from 2x daily to limit automated commits
  # and repo churn. Use workflow_dispatch with branch + mode inputs for manual catch-up runs.
  schedule:
    - cron: '0 4 * * 0'

  # Allow manual trigger with overrides
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout and commit to'
        required: false
        default: 'main'
        type: string
      limit:
        description: 'Max pages to generate this run'
        required: false
        default: '10000'
        type: string
      cluster_limit:
        description: 'Max cluster hub pages (within limit)'
        required: false
        default: '25'
        type: string
      breed_limit:
        description: 'Max breed pages (within limit)'
        required: false
        default: '3000'
        type: string
      mode:
        description: 'Generation mode: clusters | breed-pages | all'
        required: false
        default: 'all'
        type: string
      commit_changes:
        description: 'Commit generated content'
        required: false
        default: 'true'
        type: boolean

jobs:
  generate:
    name: Generate PSEO opportunity pages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair duplicate frontmatter keys
        run: |
          node scripts/content/fix-duplicate-fm-keys.mjs --apply \
            || echo "FM key repair completed (no files needed fixing)"

      - name: Clean stale generated content
        run: npm run content:clean:ci

      # Sync immediately after clean so breed-link-map reflects deletions before generation
      - name: Sync content-status after clean
        run: node scripts/content/sync-content-status.mjs --apply || echo "Content-status post-clean sync skipped"

      - name: Refresh existing generated posts
        run: npm run content:refresh

      - name: Generate PSEO opportunity pages
        run: |
          # Morning run (06:00): all mode — raised limits to clear backlog fast
          # Evening run (18:00): breed pages only, high limit for backlog catch-up
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "18" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            MODE="breed-pages"
            CLUSTER_LIMIT="0"
            BREED_LIMIT="5000"
            LIMIT="5000"
          else
            MODE="${{ inputs.mode || 'all' }}"
            CLUSTER_LIMIT="${{ inputs.cluster_limit || '25' }}"
            BREED_LIMIT="${{ inputs.breed_limit || '975' }}"
            LIMIT="${{ inputs.limit || '1000' }}"
          fi
          node scripts/content/generate-pseo-opportunity-pages.mjs \
            --mode="${MODE}" \
            --limit="${LIMIT}" \
            --cluster-limit="${CLUSTER_LIMIT}" \
            --breed-limit="${BREED_LIMIT}" \
            --min-programs=0 \
            --apply \
            || echo "PSEO generation completed (some items may have been skipped)"

      - name: Enrich existing breed content pages
        run: |
          node scripts/content/enrich-breed-pages.mjs --apply \
            || echo "Breed enrichment completed (some items may have been skipped)"

      - name: Sync content-status flags
        run: node scripts/content/sync-content-status.mjs --apply || echo "Content-status sync skipped"

      - name: Update content inventory
        run: npm run content:inventory

      - name: Regenerate sitemap
        run: npm run sitemap:generate

      - name: Check for new/changed content
        id: changes
        run: |
          git diff --quiet \
            src/content/blog/ \
            src/data/content-status.json \
            src/data/breed-link-map.json \
            public/sitemap.xml \
            2>/dev/null \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit generated content
        if: steps.changes.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.commit_changes == 'true')
        run: |
          TARGET_BRANCH="${{ inputs.branch || 'main' }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            src/content/blog/ \
            src/data/content-status.json \
            src/data/breed-link-map.json \
            public/sitemap.xml
          LIMIT="${{ inputs.limit || '1000' }}"
          MODE="${{ inputs.mode || 'all' }}"
          git commit -m "feat(pseo): generate content — mode=${MODE} limit=${LIMIT} [skip ci]"
          git push origin "$TARGET_BRANCH"

      - name: Summary
        run: |
          echo "### PSEO generation complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode:** ${{ inputs.mode || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Limit:** ${{ inputs.limit || '1000' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ inputs.branch || 'main' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changed:** ${{ steps.changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY

          if [ -f src/data/content-status.json ]; then
            TOTAL=$(node -e "const d=require('./src/data/content-status.json');console.log(Object.keys(d).length)")
            echo "- **Breeds tracked in content-status:** ${TOTAL}" >> $GITHUB_STEP_SUMMARY
          fi
