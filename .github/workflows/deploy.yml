name: Deploy PupWiki to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Content pipeline (sequential — each step depends on previous) ────
      - name: Clean stale generated content
        run: npm run content:clean:ci

      - name: Refresh generated content
        run: npm run content:refresh

      - name: Generate PSEO cluster pages
        run: npm run content:generate:pseo:ci  # limit=25 per deploy (up from 12)

      - name: Sync content-status flags with generated posts
        run: npm run content:status:sync || echo "Content-status sync skipped"

      # ── Independent enrichment steps run in parallel ─────────────────────
      # Group A: content images + inventory audit (content-side)
      # Group B: AWIN affiliate data + partners + Amazon (affiliate-side)
      # Group C: homepage hero images + breed gallery enrichment (image-side)
      - name: Parallel enrichment — content images, affiliates, breed galleries
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AWIN_OAUTH2_TOKEN: ${{ secrets.AWIN_OAUTH2_TOKEN }}
          AWIN_PRODUCT_FEED_API_KEY: ${{ secrets.AWIN_PRODUCT_FEED_API_KEY }}
          AWIN_PUBLISHER_ID: '2861861'
          AWIN_COUNTRY_CODE: 'US'
        run: |
          # Group A — content images & inventory (no external API secrets needed beyond Pexels)
          (npm run images:content:ci && npm run content:inventory) &
          PID_A=$!

          # Group B — affiliate sync (AWIN cron handles fresh data daily; ci variant is non-strict)
          (npm run awin:sync:ci && npm run awin:audit:strict && npm run partners:generate && npm run amazon:sync) &
          PID_B=$!

          # Group C — hero images + breed galleries (skip-if-exists, no --force)
          (npm run images:hero:ci && npm run images:enrich:ci) &
          PID_C=$!

          # Wait for all groups; capture exit codes
          wait $PID_A; STATUS_A=$?
          wait $PID_B; STATUS_B=$?
          wait $PID_C; STATUS_C=$?

          # Affiliate data is critical; fail the build if Group B hard-fails
          if [ $STATUS_B -ne 0 ]; then
            echo "ERROR: Affiliate sync pipeline failed (exit $STATUS_B)" >&2
            exit $STATUS_B
          fi

          # Content/image groups are soft-fail (already wrapped in || echo in scripts)
          echo "Enrichment complete — A:$STATUS_A B:$STATUS_B C:$STATUS_C"

      # ── Persist enriched data back to repo ───────────────────────────────
      - name: Commit enriched data back to repo
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            src/data/image-cache/ \
            src/data/awin-programs.json \
            src/data/awin-products.json \
            src/data/affiliate-banners.json \
            src/data/amazon-products.json \
            src/data/home-hero-images.json \
            src/content/blog/ \
            src/data/content-status.json \
            public/sitemap*.xml 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore(ci): persist enriched data [skip ci]"
          git push origin main || echo "No enrichment changes to push"

      # ── Sitemap (needs all content + routes settled) ─────────────────────
      - name: Generate sitemap
        run: npm run sitemap:generate

      # ── Astro build ───────────────────────────────────────────────────────
      - name: Build Astro site
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_AMAZON_TAG: ${{ secrets.PUBLIC_AMAZON_TAG }}
          PUBLIC_ENABLE_AMAZON_BUTTONS: ${{ vars.PUBLIC_ENABLE_AMAZON_BUTTONS }}
          PUBLIC_ENABLE_AWIN_MASTERTAG: ${{ vars.PUBLIC_ENABLE_AWIN_MASTERTAG }}
          PUBLIC_EMAILOCTOPUS_URL: ${{ secrets.PUBLIC_EMAILOCTOPUS_URL }}
        run: npm run build:ci

      # ── Post-build validation ─────────────────────────────────────────────
      - name: Audit Amazon products
        run: npm run amazon:audit

      # ── Deploy ────────────────────────────────────────────────────────────
      - name: Deploy to Cloudflare Pages with Wrangler
        if: github.event_name == 'push'
        run: npx wrangler pages deploy dist --project-name=pupwiki
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
