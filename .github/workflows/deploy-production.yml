name: Deploy Production

# Single source of truth for production deployments.
# This workflow ONLY checks out the repo, validates, builds, and deploys.
# It does NOT call external APIs, sync data, generate content, or commit files.
# Data sync: sync-awin.yml (daily 03:00 UTC)
# Content gen: generate-pseo.yml (weekly, manual)
# Old deploy.yml and deploy-scheduled.yml are disabled; see those files for history.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pupwiki-production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate sitemap
        run: npm run sitemap:generate

      - name: Validate (non-mutating checks)
        run: npm run validate:ci

      - name: Build Astro site
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_AMAZON_TAG: ${{ secrets.PUBLIC_AMAZON_TAG }}
          PUBLIC_ENABLE_AMAZON_BUTTONS: ${{ vars.PUBLIC_ENABLE_AMAZON_BUTTONS }}
          PUBLIC_ENABLE_AWIN_MASTERTAG: ${{ vars.PUBLIC_ENABLE_AWIN_MASTERTAG }}
          PUBLIC_EMAILOCTOPUS_URL: ${{ secrets.PUBLIC_EMAILOCTOPUS_URL }}
        run: npm run build:ci

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        if: always()
        run: |
          echo "### Production deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          POSTS=$(find src/content/blog -name '*.md' 2>/dev/null | wc -l || echo 0)
          echo "- **Blog posts in build:** ${POSTS}" >> $GITHUB_STEP_SUMMARY
