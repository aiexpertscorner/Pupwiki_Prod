name: Scheduled Deploy to Cloudflare Pages (DISABLED)

# SUPERSEDED by deploy-production.yml — do not re-enable.
# deploy-production.yml triggers on push to main, which covers all data/content commits
# from sync-awin.yml and generate-pseo.yml (they commit with [skip ci] to avoid loops).
# The duplicate deploys this workflow created are no longer needed.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger (this workflow is disabled)'
        required: false
        default: 'manual'

jobs:
  deploy:
    name: Build and deploy latest main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate sitemap
        run: npm run sitemap:generate

      - name: Build Astro site
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_AMAZON_TAG: ${{ secrets.PUBLIC_AMAZON_TAG }}
          PUBLIC_ENABLE_AMAZON_BUTTONS: ${{ vars.PUBLIC_ENABLE_AMAZON_BUTTONS }}
          PUBLIC_ENABLE_AWIN_MASTERTAG: ${{ vars.PUBLIC_ENABLE_AWIN_MASTERTAG }}
          PUBLIC_EMAILOCTOPUS_URL: ${{ secrets.PUBLIC_EMAILOCTOPUS_URL }}
        run: npm run build:ci

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        run: |
          echo "### Scheduled deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref:** main" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          POSTS=$(find src/content/blog -name '*.md' | wc -l)
          echo "- **Guide posts in build:** ${POSTS}" >> $GITHUB_STEP_SUMMARY
